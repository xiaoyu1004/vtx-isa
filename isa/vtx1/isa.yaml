operand_types:
  implicit_state:
    kind: implicit_state
    description: Architectural state with no encoded field.
  sgpr32:
    kind: register
    bits: 32
    register_file: SGPR
    range: s0..s255
  sgpr64:
    kind: register_pair
    bits: 64
    register_file: SGPR
    range: sE:s(E+1)
    alignment: 2
  vgpr32:
    kind: register
    bits: 32
    register_file: VGPR
    range: v0..v255
  vgpr64:
    kind: register_pair
    bits: 64
    register_file: VGPR
    range: vE:v(E+1)
    alignment: 2
  vsrc32:
    kind: mixed_source
    bits: 32
    register_file: VGPR_OR_SGPR
    range: v0..v255 or s0..s255
    description: A 32-bit vector data source. The format's source selector decides whether the 8-bit index names a VGPR or
      the frozen uniform SGPR.
