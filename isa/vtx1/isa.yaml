schema_version: 1.0-draft
title: VTX-1 ISA 1.0 Draft
version: 1.0-draft
status: Draft
word_bits: 64
counts:
  families: 66
  forms: 379
barrier_contract:
  owner_identity:
    name: linear_tid
    formula: linear_tid = warp_id * 32 + lane_id
    equivalent_tuple:
    - warp_id
    - lane_id
  live_owner_set:
    initial: every real linear_tid launched in the CTA
    shrinks_on: EXIT
    exit_contributes_release: false
  wait_record_fields:
  - warp_id
  - owner_snapshot
  - resume_pc
  max_blocked_records_per_warp: 1
  idle_slot:
    arrived_set_empty: true
    waiters_empty: true
encoding:
  word_bits: 64
  byte_order: little
  header:
    class:
      lsb: 0
      width: 4
      description: Execution class.
    format:
      lsb: 4
      width: 3
      description: Class-local payload format.
    opcode:
      lsb: 7
      width: 6
      description: Opcode local to class and format.
    guard:
      lsb: 13
      width: 6
      description: Header lane guard; zero is PT.
    payload:
      lsb: 19
      width: 45
      description: Class-local format payload.
  reserved_guard_codes:
    first: 34
    last: 63
  control_target:
    field: disp30
    decode: target_pc = next_pc + (sign_extend_30(disp30) << 3)
    unit_bytes: 8
class_registry:
- code: 0
  name: SYS
  description: System, special-register, trap, and miscellaneous operations.
- code: 1
  name: SALU
  description: Scalar arithmetic and logic.
- code: 2
  name: VALU
  description: Per-lane vector arithmetic and logic.
- code: 3
  name: MEMORY
  description: Scalar and vector memory and atomic operations.
- code: 4
  name: CONTROL
  description: Branch, reconvergence, and control flow.
- code: 5
  name: SYNC
  description: Barrier and memory synchronization.
- code: 6
  name: CROSSLANE
  description: Warp cross-lane collectives.
- code: 7
  name: MATRIX
  description: Warp-cooperative matrix operations.
