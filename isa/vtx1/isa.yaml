- id: mma
  mnemonic: MMA
  semantic_group: matrix_multiply
  summary: Warp-cooperative matrix multiply-accumulate.
  forms:
  - id: m16n8k16.f16xf16.f32
    mnemonic: MMA.M16N8K16.F16.F16.F32
    syntax: MMA.M16N8K16.F16.F16.F32 v0, v0, v0, v0
    execution_domain: warp_matrix
    encoding_format: MMA
    opcode: 0
    guard_policy: required_pt
    required_state: none
    operands:
    - name: dst
      type: mma_fragment
      access: write
      field: vd_base
    - name: a
      type: mma_fragment
      access: read
      field: va_base
    - name: b
      type: mma_fragment
      access: read
      field: vb_base
    - name: c
      type: mma_fragment
      access: read
      field: vc_base
    matrix_contract:
      shape:
        m: 16
        n: 8
        k: 16
      element_types:
        A: F16
        B: F16
        C: F32
        D: F32
      fragments:
        A:
          registers_per_lane: 4
          base_alignment: 4
          mapping: 'For lane l: row=l>>1, k0=(l&1)*8. Register r=0..3 low16 is A[row,k0+2*r], high16 is A[row,k0+2*r+1].'
        B:
          registers_per_lane: 2
          base_alignment: 2
          mapping: 'For lane l: k=l>>1, n0=(l&1)*4. Register r=0..1 low16 is B[k,n0+2*r], high16 is B[k,n0+2*r+1].'
        C:
          registers_per_lane: 4
          base_alignment: 4
          mapping: 'For lane l: row=l>>1, n0=(l&1)*4. Register r=0..3 is F32 C[row,n0+r].'
        D:
          registers_per_lane: 4
          base_alignment: 4
          mapping: 'For lane l: row=l>>1, n0=(l&1)*4. Register r=0..3 is F32 D[row,n0+r].'
      f16_packing: 'Each A/B register contains two F16 values: low16 is the lower indexed element and high16 is the next element.'
      aliasing:
        allowed:
        - D=C
        forbidden:
        - D overlaps A
        - D overlaps B
        - partial D/C overlap
        - A/B/C overlap each other
      numeric:
        formula: 'acc_0=C[row,n]; for k=0..15: acc_(k+1)=RN32(FFMA_F32(exact_F16(A[row,k]), exact_F16(B[k,n]), acc_k)); D[row,n]=acc_16'
        k_order: strictly increasing 0..15
        rounding: RNE after every F32 FFMA step; no tree reassociation
        special_values: NaN, Inf, subnormal, and signed-zero behavior is exactly docs/05-numeric-environment.md, including
          canonical qNaN for numerical NaN results.
      participation:
        required_live_lanes: 32
        required_exec_equals_live: true
    semantics: For every row and column, initialize acc=C[row,n], then for k=0..15 in increasing order set acc=RN32(FFMA_F32(exact_F16(A[row,k]),
      exact_F16(B[k,n]), acc)); write D only after all 32 lanes complete.
    constraints:
    - All active lanes execute with identical aligned fragment bases and complete fragment register ranges.
    faults:
    - COLLECTIVE_FAULT if participating lanes disagree on uniform control or required source availability.
    example:
      assembly: MMA.M16N8K16.F16.F16.F32 v0, v0, v0, v0
      machine_word: '0x0000000000000007'
architectural_limits:
  call_stack_depth: 16
  named_barrier_slots_per_cta: 8
fault_priority:
- ILLEGAL_INSTRUCTION
- ILLEGAL_OPERAND
- DIVERGENCE_FAULT
- RECONVERGENCE_FAULT
- COLLECTIVE_FAULT
- INTEGER_FAULT
- MISALIGNED_ACCESS
- MEMORY_BOUNDS
- SOFTWARE_TRAP
descriptor_contract:
  call_stack_depth:
    minimum: 0
    maximum: 16
