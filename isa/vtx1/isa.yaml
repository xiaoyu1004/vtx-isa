    kind: mixed_source_pair
    bits: 64
    register_file: VGPR_OR_SGPR
    range: vE:v(E+1) or sE:s(E+1)
    alignment: 2
    description: A 64-bit vector data source pair. The format's source selector decides which register file the even-aligned
      pair comes from.
