semantic_groups:
- atomic
- barrier
- bit_manipulation
- call_return
- compare
- conversion
- crosslane
- floating_point
- integer_arithmetic
- matrix_multiply
- memory_load
- memory_ordering
- memory_store
- move
- predicate
- select
- shuffle
- special_register
- structured_control
- system_control
- unstructured_control
- vote
- wide_integer
faults:
- code: 1
  name: ILLEGAL_INSTRUCTION
  description: Illegal instruction word, tuple, format, opcode, or reserved bit.
- code: 2
  name: ILLEGAL_OPERAND
  description: Illegal register class, resource index, target, or dynamic operand combination.
- code: 3
  name: DIVERGENCE_FAULT
  description: A form that requires a fully reconverged warp executed while the warp was not scalar-ready.
- code: 4
  name: RECONVERGENCE_FAULT
  description: Reconvergence phase/mask violation, call-stack overflow/underflow, or RET with an unclosed callee-owned frame.
- code: 5
  name: MISALIGNED_ACCESS
  description: Memory access did not satisfy required alignment.
- code: 6
  name: MEMORY_BOUNDS
  description: Address left the address-space window, or covered an unmapped or permission-denied byte.
- code: 7
  name: INTEGER_FAULT
  description: Defined integer error such as division by zero.
- code: 8
  name: COLLECTIVE_FAULT
  description: Warp collective or matrix participation violation.
- code: 9
  name: SOFTWARE_TRAP
  description: Program executed TRAP with a participating thread.
- code: 10
  name: DEADLOCK
  description: Architectural deadlock condition was reached.
families:
- id: nop
  mnemonic: NOP
  semantic_group: system_control
  summary: No architectural effect except advancing PC.
  forms:
  - id: base
    mnemonic: NOP
    syntax: NOP
    execution_domain: system
    encoding_format: SYS
    opcode: 0
    guard_policy: required_pt
    required_state: none
    operands:
    - name: pc
      type: implicit_state
      access: read_write
      implicit: true
    semantics: Advance PC by one 64-bit instruction.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    example:
      assembly: NOP
      machine_word: '0x0000000000000000'
- id: trap
  mnemonic: TRAP
  semantic_group: system_control
  summary: Raise a software trap with a 32-bit reason.
  forms:
  - id: reason
    mnemonic: TRAP
    syntax: TRAP 0
    execution_domain: system
    encoding_format: SYS
    opcode: 1
    guard_policy: required_pt
    required_state: none
    operands:
    - name: reason
      type: uimm16
      access: read
      field: imm16
    semantics: If any guarded lane participates, raise SOFTWARE_TRAP with reason; otherwise advance PC.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    example:
      assembly: TRAP 0
      machine_word: '0x0000000000000080'
- id: s-getreg
  mnemonic: S_GETREG
  semantic_group: special_register
  summary: Read a uniform special register.
  forms:
  - id: u32
    mnemonic: S_GETREG.U32
    syntax: S_GETREG.U32 s0, USR_WARP_ID
    execution_domain: scalar
    encoding_format: SYS
    opcode: 2
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: dst
      type: sgpr32
      access: write
      field: a
    - name: sr
      type: uniform_special
      access: read
      field: b
    semantics: Snapshot the selected 32-bit uniform special register into dst.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    - The warp must be scalar-ready before source snapshot, validation, and commit.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    - DIVERGENCE_FAULT if the warp is not scalar-ready; the instruction commits no architectural effect.
    example:
      assembly: S_GETREG.U32 s0, USR_WARP_ID
      machine_word: '0x0000000000000100'
  - id: u64
    mnemonic: S_GETREG.U64
    syntax: S_GETREG.U64 s0:s1, USR_CLOCK64
    execution_domain: scalar
    encoding_format: SYS
    opcode: 3
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: dst
      type: sgpr64
      access: write
      field: a
    - name: sr
      type: uniform_special
      access: read
      field: b
    semantics: Snapshot the selected 64-bit uniform special register into the even SGPR pair dst.
    constraints:
    - The selected register must be 64-bit and dst must be an even SGPR pair.
    - The warp must be scalar-ready before source snapshot, validation, and commit.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    - DIVERGENCE_FAULT if the warp is not scalar-ready; the instruction commits no architectural effect.
    example:
      assembly: S_GETREG.U64 s0:s1, USR_CLOCK64
      machine_word: '0x0000000000000180'
