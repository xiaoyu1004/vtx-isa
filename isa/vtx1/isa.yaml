- id: ssy
  mnemonic: SSY
  semantic_group: structured_control
  summary: Push a structured reconvergence token.
  forms:
  - id: direct
    mnemonic: SSY
    syntax: SSY 0
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 0
    guard_policy: required_pt
    required_state: none
    operands:
    - name: target
      type: disp30
      access: control
      field: disp30
    - name: reconvergence_stack
      type: implicit_state
      access: read_write
      implicit: true
    - name: call_stack
      type: call_stack
      access: read
      implicit: true
    semantics: Validate the JOIN target and stack capacity, then push a reconvergence frame whose owner_call_depth is exactly
      call_stack.depth at SSY execution; also record target, current active mask, empty pending/arrived masks, and phase=ARMED.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    - 'disp30 is a signed instruction-word displacement: target_pc = next_pc + (sign_extend_30(disp30) << 3).'
    - The new frame sets owner_call_depth = call_stack.depth; SSY reads but never modifies call_stack.
    faults:
    - ILLEGAL_OPERAND on an unaligned or out-of-text target; RECONVERGENCE_FAULT on a control-stack protocol violation.
    example:
      assembly: SSY 0
      machine_word: '0x0000000000000004'
- id: bra
  mnemonic: BRA
  semantic_group: unstructured_control
  summary: Direct PC-relative branch.
  forms:
  - id: direct
    mnemonic: BRA
    syntax: BRA 0
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 1
    guard_policy: required_pt
    required_state: none
    operands:
    - name: target
      type: disp30
      access: control
      field: disp30
    semantics: Jump to next_pc + (sign_extend_30(disp30) << 3) without scalar-ready or call-stack effects.
    constraints:
    - All unused extension and reserved bits are zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid operand.
    example:
      assembly: BRA 0
      machine_word: '0x0000000000000084'
- id: bra-p
  mnemonic: BRA.P
  semantic_group: structured_control
  summary: Conditionally branch the guarded lane subset.
  forms:
  - id: direct
    mnemonic: BRA.P
    syntax: BRA.P PT, 0
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 2
    guard_policy: explicit_condition
    required_state: none
    operands:
    - name: target
      type: disp30
      access: control
      field: disp30
    - name: active_mask
      type: implicit_state
      access: read_write
      implicit: true
    - name: condition
      type: pred_cond
      access: control
      field: cond6
    semantics: Branch guarded lanes to target and retain the complement for structured reconvergence.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    - 'disp30 is a signed instruction-word displacement: target_pc = next_pc + (sign_extend_30(disp30) << 3).'
    faults:
    - ILLEGAL_OPERAND on an unaligned or out-of-text target; RECONVERGENCE_FAULT on a control-stack protocol violation.
    example:
      assembly: BRA.P PT, 0
      machine_word: '0x0000000000000104'
- id: join
  mnemonic: JOIN
  semantic_group: structured_control
  summary: Reconverge at the top SSY target.
  forms:
  - id: base
    mnemonic: JOIN
    syntax: JOIN
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 3
    guard_policy: required_pt
    required_state: none
    operands:
    - name: reconvergence_stack
      type: implicit_state
      access: read_write
      implicit: true
    semantics: 'Require PC == top.reconv_pc. ARMED: require active_mask==entry_mask, pop, advance. FIRST: save active_mask
      to arrived_mask, set SECOND, restore pending_mask&live_mask, clear pending_mask, jump pending_pc. SECOND: require arrived_mask|active_mask==entry_mask,
      pop, restore the union masked by live_mask, advance. Any empty-stack, PC, phase, or mask mismatch raises RECONVERGENCE_FAULT
      atomically.'
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    faults:
    - ILLEGAL_OPERAND on an unaligned or out-of-text target; RECONVERGENCE_FAULT on a control-stack protocol violation.
    example:
      assembly: JOIN
      machine_word: '0x0000000000000184'
- id: exit
  mnemonic: EXIT
  semantic_group: structured_control
  summary: Permanently retire guarded lanes.
  forms:
  - id: base
    mnemonic: EXIT
    syntax: EXIT PT
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 4
    guard_policy: explicit_condition
    required_state: none
    operands:
    - name: live_mask
      type: implicit_state
      access: read_write
      implicit: true
    - name: condition
      type: pred_cond
      access: control
      field: cond6
    semantics: Retire every participating lane. Each retired lane is atomically removed from the CTA's live_owner_set, which
      can complete a barrier that the remaining owners are waiting on. EXIT itself performs no shared release.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    faults:
    - ILLEGAL_OPERAND on an unaligned or out-of-text target; RECONVERGENCE_FAULT on a control-stack protocol violation.
    example:
      assembly: EXIT PT
      machine_word: '0x0000000000000204'
- id: call
  mnemonic: CALL
  semantic_group: call_return
  summary: Call a direct or indirect subroutine.
  forms:
  - id: direct
    mnemonic: CALL
    syntax: CALL 0
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 5
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: target
      type: disp30
      access: control
      field: disp30
    - name: call_stack
      type: call_stack
      access: read_write
      implicit: true
    semantics: Require scalar_ready and call_stack.depth < descriptor.call_stack_depth <= architectural_limits.call_stack_depth;
      push only return_pc=PC+8, preserving any caller ARMED reconvergence frames unchanged; then transfer to the disp30 PC-relative
      target. No control context is stored in the call frame.
    constraints:
    - descriptor.call_stack_depth is in 0..16 and call_stack.depth is strictly below it before push.
    - Caller reconvergence frames, including ARMED frames with lower owner_call_depth, are allowed and remain untouched.
    faults:
    - DIVERGENCE_FAULT before reading target or stack state when not scalar-ready.
    - RECONVERGENCE_FAULT when descriptor.call_stack_depth is exceeded; ILLEGAL_OPERAND on an invalid target.
    example:
      assembly: CALL 0
      machine_word: '0x0000000000000284'
  - id: indirect
    mnemonic: CALL.IND
    syntax: CALL.IND s0:s1
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 6
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: target
      type: sgpr64
      access: control
      field: aux8
    - name: call_stack
      type: call_stack
      access: read_write
      implicit: true
    semantics: Require scalar_ready and call_stack.depth < descriptor.call_stack_depth <= architectural_limits.call_stack_depth;
      push only return_pc=PC+8, preserving any caller ARMED reconvergence frames unchanged; then transfer to the aligned in-text
      SGPR64 target. No control context is stored in the call frame.
    constraints:
    - descriptor.call_stack_depth is in 0..16 and call_stack.depth is strictly below it before push.
    - Caller reconvergence frames, including ARMED frames with lower owner_call_depth, are allowed and remain untouched.
    faults:
    - DIVERGENCE_FAULT before reading target or stack state when not scalar-ready.
    - RECONVERGENCE_FAULT when descriptor.call_stack_depth is exceeded; ILLEGAL_OPERAND on an invalid target.
    example:
      assembly: CALL.IND s0:s1
      machine_word: '0x0000000000000304'
- id: ret
  mnemonic: RET
  semantic_group: call_return
  summary: Return from a subroutine.
  forms:
  - id: base
    mnemonic: RET
    syntax: RET
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 7
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: call_stack
      type: call_stack
      access: read_write
      implicit: true
    semantics: Require scalar_ready and a nonempty call stack. Let depth=call_stack.depth. Reject only if a reconvergence
      frame exists with owner_call_depth == depth; caller frames with smaller owner_call_depth, including ARMED frames, are
      allowed. Then read top.return_pc, pop exactly that return_pc entry, and set PC to it.
    constraints:
    - RET does not reject or pop caller frames with owner_call_depth < call_stack.depth.
    - The call frame contains only return_pc.
    faults:
    - DIVERGENCE_FAULT before reading stack state when not scalar-ready.
    - RECONVERGENCE_FAULT on empty call stack or any unclosed callee frame whose owner_call_depth equals current call_stack.depth.
    example:
      assembly: RET
      machine_word: '0x0000000000000384'
- id: jump-ind
  mnemonic: JUMP.IND
  semantic_group: unstructured_control
  summary: Indirect scalar-ready jump.
  forms:
  - id: indirect
    mnemonic: JUMP.IND
    syntax: JUMP.IND s0:s1
    execution_domain: warp_control
    encoding_format: CTRL
    opcode: 8
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: target
      type: sgpr64
      access: control
      field: aux8
    semantics: After scalar-ready validation, jump to the aligned in-text SGPR target without changing the call stack.
    constraints:
    - All unused extension and reserved bits are zero.
    - The warp must be scalar-ready before reading any dynamic source or hidden state.
    faults:
    - DIVERGENCE_FAULT before reading target; ILLEGAL_OPERAND on an invalid target.
    example:
      assembly: JUMP.IND s0:s1
      machine_word: '0x0000000000000404'
- id: fence
  mnemonic: FENCE
  semantic_group: memory_ordering
  summary: Order memory accesses at a selected scope.
  forms:
  - id: cta
    mnemonic: FENCE.CTA
    syntax: FENCE.CTA
    execution_domain: cta_sync
    encoding_format: SYNC
    opcode: 0
    guard_policy: required_pt
    required_state: none
    operands:
    - name: memory_state
      type: implicit_state
      access: read_write
      implicit: true
    field_values:
      scope2: 0
      order2: 3
    semantics: Complete prior accesses and order later accesses at CTA scope.
    constraints:
    - All active lanes execute the same scope; control and register fields are zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    example:
      assembly: FENCE.CTA
      machine_word: '0x0300000000000005'
  - id: device
    mnemonic: FENCE.DEVICE
    syntax: FENCE.DEVICE
    execution_domain: cta_sync
    encoding_format: SYNC
    opcode: 1
    guard_policy: required_pt
    required_state: none
    operands:
    - name: memory_state
      type: implicit_state
      access: read_write
      implicit: true
    field_values:
      scope2: 1
      order2: 3
    semantics: Complete prior accesses and order later accesses at DEVICE scope.
    constraints:
    - All active lanes execute the same scope; control and register fields are zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    example:
      assembly: FENCE.DEVICE
      machine_word: '0x0340000000000085'
  - id: system
    mnemonic: FENCE.SYSTEM
    syntax: FENCE.SYSTEM
    execution_domain: cta_sync
    encoding_format: SYNC
    opcode: 2
    guard_policy: required_pt
    required_state: none
    operands:
    - name: memory_state
      type: implicit_state
      access: read_write
      implicit: true
    field_values:
      scope2: 2
      order2: 3
    semantics: Complete prior accesses and order later accesses at SYSTEM scope.
    constraints:
    - All active lanes execute the same scope; control and register fields are zero.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register or modifier.
    example:
      assembly: FENCE.SYSTEM
      machine_word: '0x0380000000000105'
- id: bar-sync
  mnemonic: BAR.SYNC
  semantic_group: barrier
  summary: Whole-CTA barrier with release/acquire ordering.
  forms:
  - id: cta
    mnemonic: BAR.SYNC.CTA
    syntax: BAR.SYNC.CTA 3
    execution_domain: cta_sync
    encoding_format: SYNC
    opcode: 3
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: barrier
      type: barrier_id
      access: control
      field: slot3
    semantics: Convert every entry-active lane to its CTA linear_tid, atomically add those owners to the slot's arrived_set,
      make each arrival a shared CTA release, and block the whole warp with one BarrierWaitRecord {warp_id, owner_snapshot,
      resume_pc=old_PC+8}. The barrier completes as soon as arrived_set equals the CTA's live_owner_set; every waiter then
      takes a shared CTA acquire and resumes by writing only PC=resume_pc and ready, and the slot is atomically cleared to
      idle.
    constraints:
    - slot3 is the explicit barrier id 0..7; each CTA has eight slots, an idle slot has an empty arrived_set and no waiters,
      and every barrier owner identity is CTA linear_tid = warp_id*32+lane_id.
    - BAR.SYNC.CTA requires scalar_ready, so the warp must be fully reconverged; a divergent warp faults before any arrival
      is recorded.
    - EXIT removes the exiting linear_tid from live_owner_set and may therefore complete a pending barrier, but EXIT itself
      contributes no shared release.
    - All unused extension and reserved bits are zero.
    faults:
    - DIVERGENCE_FAULT when the warp is not scalar-ready; ILLEGAL_OPERAND on an invalid slot id; ILLEGAL_INSTRUCTION on reserved
      bits.
    example:
      assembly: BAR.SYNC.CTA 3
      machine_word: '0x0018000000000185'
- id: x-broadcast
  mnemonic: X_BROADCAST
  semantic_group: crosslane
  summary: Broadcast a selected active lane value.
  forms:
  - id: reg_lane
    mnemonic: X_BROADCAST.B32
    syntax: X_BROADCAST.B32 v0, v0, s0
    execution_domain: warp_collective
    encoding_format: COLL
    opcode: 0
    guard_policy: required_pt
    required_state: none
    operands:
    - name: dst
      type: vgpr32
      access: write
      field: vd
    - name: src
      type: vgpr32
      access: read
      field: va
    - name: lane
      type: sgpr32
      access: read
      field: vb
    semantics: Copy src from the selected lane to dst in every active lane.
    constraints:
    - The lane selector is warp-uniform and names an active lane.
    faults:
    - COLLECTIVE_FAULT if participating lanes disagree on uniform control or required source availability.
    example:
      assembly: X_BROADCAST.B32 v0, v0, s0
      machine_word: '0x0000000000000006'
  - id: imm_lane
    mnemonic: X_BROADCAST.B32
    syntax: X_BROADCAST.B32 v0, v0, 0
    execution_domain: warp_collective
    encoding_format: COLL
    opcode: 1
    guard_policy: required_pt
    required_state: none
    operands:
    - name: dst
      type: vgpr32
      access: write
      field: vd
    - name: src
      type: vgpr32
      access: read
      field: va
    - name: lane
      type: uimm8
      access: read
      field: imm8
    semantics: Broadcast src from lane imm8[4:0] to every active lane; imm8[7:5] is zero.
    constraints:
    - imm8 is in 0..31 and names an active lane.
    faults:
    - COLLECTIVE_FAULT if participating lanes disagree on uniform control or required source availability.
    example:
      assembly: X_BROADCAST.B32 v0, v0, 0
      machine_word: '0x0000000000000086'
- id: s-readfirst
  mnemonic: S_READFIRST
  semantic_group: crosslane
  summary: Read a VGPR value from the first active lane into an SGPR.
  forms:
  - id: b32
    mnemonic: S_READFIRST.B32
    syntax: S_READFIRST.B32 s0, v0
    execution_domain: scalar
    encoding_format: COLL
    opcode: 4
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: dst
      type: sgpr32
      access: write
      field: smask
    - name: src
      type: vgpr32
      access: read
      field: va
    semantics: Find the least-numbered active lane and copy its src value to scalar dst.
    constraints:
    - The active mask is nonempty.
    - The warp must be scalar-ready before source snapshot, validation, and commit.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register pair or statically invalid operand.
    - DIVERGENCE_FAULT if the warp is not scalar-ready; the instruction commits no architectural effect.
    example:
      assembly: S_READFIRST.B32 s0, v0
      machine_word: '0x0000000000000206'
  - id: b64
    mnemonic: S_READFIRST.B64
    syntax: S_READFIRST.B64 s0:s1, v0:v1
    execution_domain: scalar
    encoding_format: COLL
    opcode: 5
    guard_policy: required_pt
    required_state: scalar_ready
    operands:
    - name: dst
      type: sgpr64
      access: write
      field: smask
    - name: src
      type: vgpr64
      access: read
      field: va
    semantics: After scalar-ready succeeds, select the least-numbered live lane and copy its complete VGPR pair to the SGPR
      pair.
    constraints:
    - The warp must be scalar-ready before selecting the lane or reading either half of the source pair.
    - Both encoded pair bases are even and the complete low/high register pair is in range.
    faults:
    - ILLEGAL_INSTRUCTION on a reserved encoding; ILLEGAL_OPERAND on an invalid register pair or statically invalid operand.
    - DIVERGENCE_FAULT if the warp is not scalar-ready; the instruction commits no architectural effect.
    example:
      assembly: S_READFIRST.B64 s0:s1, v0:v1
      machine_word: '0x0000000000000286'
- id: v-vote
  mnemonic: V_VOTE
  semantic_group: vote
  summary: Reduce a vector predicate across active lanes.
  forms:
  - id: any
