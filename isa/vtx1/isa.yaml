    encoding_format: COLL
    opcode: 6
    guard_policy: required_pt
    required_state: none
    operands:
    - name: dst
      type: scc
      access: write
      implicit: true
    - name: predicate
      type: vpred
      access: read
      field: va
    semantics: Reduce participating predicate bits with ANY and write SCC implicitly.
    constraints:
    - Encoded registers must belong to the declared register files; every unused payload field is zero.
    faults:
    - COLLECTIVE_FAULT if participating lanes disagree on uniform control or required source availability.
    example:
